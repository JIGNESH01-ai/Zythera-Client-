name: Zythera 1.20.1 modpack
on:
  push:
    paths: ['zythera-client/**', 'modpack/**', '.github/workflows/zythera-modpack.yml']
  pull_request:
    paths: ['zythera-client/**', 'modpack/**', '.github/workflows/zythera-modpack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Zythera
        run: ./zythera-client/gradlew -p zythera-client --no-daemon build
      - name: Download version-matched upstream mod JARs
        run: |
          set -euo pipefail
          mkdir -p inputs
          cp zythera-client/build/libs/zythera-client-0.5.7.jar inputs/
          curl --fail --location --retry 3 -o 'inputs/fabric-api-0.92.2+1.20.1.jar' 'https://github.com/FabricMC/fabric-api/releases/download/0.92.2%2B1.20.1/fabric-api-0.92.2%2B1.20.1.jar'
          curl --fail --location --retry 3 -o 'inputs/sodium-fabric-0.5.11+mc1.20.1.jar' 'https://github.com/CaffeineMC/sodium/releases/download/mc1.20.1-0.5.11/sodium-fabric-0.5.11%2Bmc1.20.1.jar'
          curl --fail --location --retry 3 -o 'inputs/ferritecore-6.0.1-fabric.jar' 'https://cdn.modrinth.com/data/uXXizFIs/versions/unerR5MN/ferritecore-6.0.1-fabric.jar'
          curl --fail --location --retry 3 -o 'inputs/lithium-fabric-mc1.20.1-0.11.4.jar' 'https://github.com/CaffeineMC/lithium/releases/download/mc1.20.1-0.11.4/lithium-fabric-mc1.20.1-0.11.4.jar'
      - name: Verify inputs and assemble both archive formats
        run: |
          python3 modpack/scripts/assemble.py inputs
          python3 modpack/scripts/create_instance.py
      - uses: actions/upload-artifact@v4
        with:
          name: zythera-modpack-1.20.1
          path: |
            zythera-client-1.20.1-v0.5.7-alpha.mrpack
            zythera-client-1.20.1-v0.5.7-alpha.zip
            zythera-modpack-1.20.1-v0.5.7-alpha.zip
            zythera-client/build/libs/zythera-client-0.5.7.jar
          if-no-files-found: error
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless graphics dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 flite1-dev
      - name: Launch development client to rendered title screen
        env:
          ZYTHERA_SMOKE_TEST: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          ALSA_CONFIG_PATH: /tmp/zythera-asound.conf
        run: |
          set -o pipefail
          mkdir -p zythera-client/run/mods
          python3 -c 'import zipfile; z=zipfile.ZipFile("zythera-client/run/mods/fixture.jar.disabled", "w"); z.writestr("fabric.mod.json", "{\"schemaVersion\":1,\"id\":\"zythera_smoke_fixture\",\"version\":\"1\",\"name\":\"Smoke Fixture\"}"); z.close()'
          printf 'onboardAccessibility:false\nnarrator:0\n' > zythera-client/run/options.txt
          printf 'pcm.!default { type null }\nctl.!default { type hw card 0 }\n' > /tmp/zythera-asound.conf
          timeout 180 xvfb-run -a ./zythera-client/gradlew -p zythera-client --no-daemon runClient 2>&1 | tee smoke.log
          grep -F '[Zythera] SMOKE_SPLASH_RENDERED artwork=true font=true background=true' smoke.log
          grep -F '[Zythera] SMOKE_ANIMATION_COMPLETE' smoke.log
          grep -F '[Zythera] SMOKE_TITLE_RENDERED' smoke.log
          grep -F '[Zythera] SMOKE_INSTALLED_MODS_OK' smoke.log
          grep -F '[Zythera] SMOKE_PROFILES_OK' smoke.log
          grep -Fx 'renderDistance:2' zythera-client/run/options.txt
          grep -Fx 'simulationDistance:2' zythera-client/run/options.txt
          ZYTHERA_SMOKE_TEST=restart timeout 180 xvfb-run -a ./zythera-client/gradlew -p zythera-client --no-daemon runClient 2>&1 | tee -a smoke.log
          grep -F '[Zythera] SMOKE_RESTART_OK restart' smoke.log
          grep -Fx 'simulationDistance:3' zythera-client/run/options.txt
          ZYTHERA_SMOKE_TEST=custom timeout 180 xvfb-run -a ./zythera-client/gradlew -p zythera-client --no-daemon runClient 2>&1 | tee -a smoke.log
          grep -F '[Zythera] SMOKE_RESTART_OK custom' smoke.log
      - name: Inspect 1.20.1 simulation option on failure
        if: failure()
        run: |
          jar=$(find "$HOME/.gradle/caches/fabric-loom" -type f -name 'minecraft-merged-*.jar' | grep 'yarn' | head -1)
          javap -p -c -classpath "$jar" net.minecraft.client.option.GameOptions > /tmp/zythera-options-bytecode
          python3 -c 'from pathlib import Path; s=Path("/tmp/zythera-options-bytecode").read_text(); p=s.find("options.simulationDistance"); print("::notice title=Simulation option bytecode::"+s[max(0,p-350):p+2000].replace("%","%25").replace("\n","%0A"))'
      - name: Report smoke log on failure
        if: failure()
        run: |
          if [ -f smoke.log ]; then
            python3 -c 'from pathlib import Path; s="\n".join(x[:250] for x in [l for l in Path("smoke.log").read_text(errors="replace").splitlines() if any(k in l for k in ("Exception", "Error", "rejected", "Caused by", "SMOKE_"))][-12:]); print("::error title=Smoke test log::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zythera-smoke-log
          path: smoke.log
          if-no-files-found: ignore
  release:
    needs: [package, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/47736e62-zythera-client'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zythera-modpack-1.20.1
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=zythera-modpack-1.20.1-v0.5.7-alpha
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; not overwriting it.'
            exit 0
          fi
          gh release create "$tag" zythera-client-1.20.1-v0.5.7-alpha.mrpack zythera-client-1.20.1-v0.5.7-alpha.zip zythera-modpack-1.20.1-v0.5.7-alpha.zip zythera-client/build/libs/zythera-client-0.5.7.jar --target "$TARGET_SHA" --title 'Zythera 1.20.1 modpack 0.5.7 alpha' --notes 'Experimental pack: this release contains the original five JARs, NOT the requested 12-mod set. CI desktop development client rendered the title screen and installed-mods menu; gameplay and PojavLauncher/Android have not been tested. Requires Minecraft Java 1.20.1, Fabric Loader and Java 17. Read INSTALL.txt. Sodium may be incompatible with some Pojav renderers; remove it if necessary.' --prerelease
