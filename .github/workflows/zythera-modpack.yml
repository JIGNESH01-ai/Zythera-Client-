name: Zythera 1.20.1 modpack
on:
  push:
    paths: ['zythera-client/**', 'modpack/**', '.github/workflows/zythera-modpack.yml']
  pull_request:
    paths: ['zythera-client/**', 'modpack/**', '.github/workflows/zythera-modpack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Zythera
        run: ./zythera-client/gradlew -p zythera-client --no-daemon build
      - name: Download version-matched upstream mod JARs
        run: |
          set -euo pipefail
          mkdir -p inputs
          cp zythera-client/build/libs/zythera-client-0.2.0.jar inputs/
          curl --fail --location --retry 3 -o 'inputs/fabric-api-0.92.2+1.20.1.jar' 'https://github.com/FabricMC/fabric-api/releases/download/0.92.2%2B1.20.1/fabric-api-0.92.2%2B1.20.1.jar'
          curl --fail --location --retry 3 -o 'inputs/sodium-fabric-0.5.11+mc1.20.1.jar' 'https://github.com/CaffeineMC/sodium/releases/download/mc1.20.1-0.5.11/sodium-fabric-0.5.11%2Bmc1.20.1.jar'
          curl --fail --location --retry 3 -o 'inputs/lithium-fabric-mc1.20.1-0.11.4.jar' 'https://github.com/CaffeineMC/lithium/releases/download/mc1.20.1-0.11.4/lithium-fabric-mc1.20.1-0.11.4.jar'
      - name: Verify inputs and assemble ZIP
        run: python3 modpack/scripts/assemble.py inputs
      - uses: actions/upload-artifact@v4
        with:
          name: zythera-modpack-1.20.1
          path: zythera-modpack-1.20.1-v0.2.0-alpha.zip
          if-no-files-found: error
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/47736e62-zythera-client'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zythera-modpack-1.20.1
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=zythera-modpack-1.20.1-v0.2.0-alpha
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; not overwriting it.'
            exit 0
          fi
          gh release create "$tag" zythera-modpack-1.20.1-v0.2.0-alpha.zip --target "$TARGET_SHA" --title 'Zythera 1.20.1 modpack 0.2.0 alpha' --notes 'Experimental pack; compilation and package integrity checked, not tested in Minecraft or PojavLauncher. Requires Minecraft Java 1.20.1, Fabric Loader and Java 17. Read INSTALL.txt. Sodium may be incompatible with some Pojav renderers; remove it if necessary.' --prerelease
